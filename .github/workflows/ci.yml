name: GCC 15.2 / Boost 1.88 / LLVM 21

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLANG_FORMAT: clang-format-21
  CLANG_TIDY: clang-tidy-21

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore GCC and Boost cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cpfp/gcc-15.2.0
            ~/.cache/cpfp/boost_1_88_0
          key: ubuntu-24.04-gcc-15.2.0-boost-1.88.0-v1

      - name: Install GCC 15.2.0
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${HOME}/.cache/cpfp/gcc-15.2.0"
          if [[ ! -x "${install_dir}/bin/g++" ]]; then
            mkdir -p "${install_dir}"
            archive="${RUNNER_TEMP}/xpack-gcc.tar.gz"
            curl --fail --location --silent --show-error \
              --output "${archive}" \
              https://github.com/xpack-dev-tools/gcc-xpack/releases/download/v15.2.0-1/xpack-gcc-15.2.0-1-linux-x64.tar.gz
            echo "f6dcc3815299a23b2b4372223c4ca5f1b5a0543ed097d57eb67e0753b7c484e0  ${archive}" \
              | sha256sum --check
            tar xzf "${archive}" --strip-components=1 -C "${install_dir}"
          fi
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Install Boost 1.88.0 headers
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${HOME}/.cache/cpfp/boost_1_88_0"
          if [[ ! -f "${install_dir}/boost/version.hpp" ]]; then
            mkdir -p "${install_dir}"
            archive="${RUNNER_TEMP}/boost_1_88_0.tar.gz"
            curl --fail --location --silent --show-error \
              --output "${archive}" \
              https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.gz
            echo "3621533e820dcab1e8012afd583c0c73cf0f77694952b81352bf38c1488f9cb4  ${archive}" \
              | sha256sum --check
            tar xzf "${archive}" --strip-components=1 -C "${install_dir}"
          fi
          echo "BOOST_ROOT=${install_dir}" >> "${GITHUB_ENV}"

      - name: Install LLVM 21 tools
        shell: bash
        run: |
          set -euo pipefail
          installer="${RUNNER_TEMP}/llvm.sh"
          curl --fail --location --silent --show-error \
            --output "${installer}" https://apt.llvm.org/llvm.sh
          chmod +x "${installer}"
          sudo "${installer}" 21
          sudo apt-get install --yes ninja-build clang-format-21 clang-tidy-21

      - name: Show tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          clang-format-21 --version
          clang-tidy-21 --version

      - name: Build, test, and analyze
        run: bash scripts/check.sh
